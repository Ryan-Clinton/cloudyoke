name: Join the network
description: Add a site with a £15 cloudyoke station or an existing cloud sensor.
title: "Join: <your area>"
labels: ["join"]
body:
  - type: markdown
    attributes:
      value: |
        A site joins with an infrared cloud sensor: the £15 ESP32 station on your WiFi, or a CloudWatcher, Boltwood
        or other ASCOM sensor you already run. The steps are in [docs/join.md](https://github.com/Ryan-Clinton/cloudyoke/blob/main/docs/join.md).

        **This issue is public.** Give a town or area, never an address or exact coordinates. The page shows the
        area's name only.
  - type: input
    id: area
    attributes:
      label: Area and country
      description: A town, village or area. This is the name the page will show.
      placeholder: Brecon, Wales
    validations:
      required: true
  - type: checkboxes
    id: have
    attributes:
      label: Which way in
      options:
        - label: I'll build the £15 station (ESP32, MLX90614, BME280, on WiFi and a phone charger), or I already have the parts.
        - label: I run an existing cloud sensor (AAG CloudWatcher, Boltwood, other ASCOM ObservingConditions).
  - type: textarea
    id: kit
    attributes:
      label: Your kit, if any
      description: Parts you already have, or your sensor's make and driver.
  - type: textarea
    id: help
    attributes:
      label: What would help you take part?
      description: Parts lists, a hand with wiring, a simpler way to send reports, anything.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I've given an area, not an address or coordinates.
          required: true
